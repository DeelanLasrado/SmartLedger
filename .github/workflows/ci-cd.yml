name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: "8.0.x"
  IMAGE_NAME: smartledger-api

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SmartLedger.sln

      - name: Build
        run: dotnet build SmartLedger.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SmartLedger.sln --configuration Release --no-build --verbosity normal

      - name: Docker Build
        if: github.event_name == 'push'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REF=ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}" >> "$GITHUB_ENV"
          docker build -t "ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
                       -t "ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}:latest" .

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE_REF}:${{ github.sha }}"
          docker push "${IMAGE_REF}:latest"

